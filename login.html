<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CTR System Login</title>

  <link rel="stylesheet" href="css/ctr.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .login-box h1 {
      margin-top: 0;
      color: #0c2d53;
      font-size: 24px;
    }

    .login-box p {
      color: #66788a;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #17395d;
    }

    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0c2d53;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginMessage {
      min-height: 20px;
      margin-bottom: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-page">

    <div class="login-box">

      <h1>CTR Management System</h1>

      <p>
        Sign in using your authorized account.
      </p>

      <form id="loginForm">

        <div class="login-field">
          <label for="loginEmail">Email</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter email"
            required
          >
        </div>


        <div class="login-field">
          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
            required
          >
        </div>


        <div id="loginMessage"></div>


        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Sign In
        </button>

      </form>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js"></script>

  <script src="js/login.js"></script>

</body>

</html>
