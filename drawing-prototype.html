<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CTR Drawing | CTR Management
  </title>


  <!-- EXISTING WEBSITE CSS -->
  <link
    rel="stylesheet"
    href="css/ctr.css"
  >


  <style>

    /* =====================================================
       DRAWING WORKSPACE PAGE
    ===================================================== */

    body {
      margin: 0;
      background: #f3f5f7;
      font-family: Arial, Helvetica, sans-serif;
    }


    .ctr-drawing-page {

      width: 100%;
      max-width: 100%;

      padding:
        22px
        28px
        35px;

    }


    /* =====================================================
       PAGE HEADER
    ===================================================== */

    .ctr-drawing-page-head {

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 16px;

    }


    .ctr-drawing-breadcrumb {

      margin-bottom: 5px;

      color: #66788a;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.4px;

    }


    .ctr-drawing-page-head h1 {

      margin: 0;

      color: #102f52;

      font-size: 24px;
      font-weight: 700;

    }


    .ctr-drawing-subtitle {

      margin:
        5px
        0
        0;

      color: #66788a;

      font-size: 12px;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .ctr-drawing-status {

      display: flex;
      align-items: center;

      gap: 6px;

      flex-wrap: wrap;

    }


    .ctr-drawing-chip {

      min-height: 27px;

      display: inline-flex;
      align-items: center;

      padding:
        0
        9px;

      border:
        1px solid #cbd4dd;

      border-radius: 3px;

      background: #ffffff;

      color: #40576c;

      font-size: 9px;
      font-weight: 700;

    }


    .ctr-drawing-chip.draft {

      border-color: #d6a850;

      background: #fffaf0;

      color: #815b0b;

    }


    /* =====================================================
       MAIN COMMAND BAR
    ===================================================== */

    .ctr-drawing-command-bar {

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 14px;

      padding:
        9px
        11px;

      border:
        1px solid #cbd4dd;

      background: #ffffff;

    }


    .ctr-drawing-command-left,
    .ctr-drawing-command-right {

      display: flex;
      align-items: center;

      gap: 7px;

      flex-wrap: wrap;

    }


    .ctr-work-btn {

      min-height: 34px;

      padding:
        0
        12px;

      border:
        1px solid #aab8c5;

      border-radius: 3px;

      background: #ffffff;

      color: #27445f;

      cursor: pointer;

      font-size: 10px;
      font-weight: 700;

    }


    .ctr-work-btn:hover {

      background: #f0f4f7;

    }


    .ctr-work-btn.primary {

      border-color: #173e6e;

      background: #173e6e;

      color: #ffffff;

    }


    /* =====================================================
       BUILDER DRAWER
    ===================================================== */

    #ctrBuilderDrawer {

      display: none;

      margin-bottom: 14px;

      border:
        1px solid #bdc8d3;

      background: #ffffff;

    }


    #ctrBuilderDrawer.open {

      display: block;

    }


    .ctr-builder-drawer-head {

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        10px
        13px;

      border-bottom:
        1px solid #d6dde4;

      background: #f5f7f9;

    }


    .ctr-builder-drawer-head strong {

      color: #173e6e;

      font-size: 12px;

    }


    .ctr-builder-drawer-head span {

      display: block;

      margin-top: 2px;

      color: #6c7d8e;

      font-size: 9px;

    }


    #ctrCloseBuilder {

      width: 30px;
      height: 30px;

      border:
        1px solid #b7c2cc;

      background: #ffffff;

      cursor: pointer;

    }


    /*
      ctr-builder.js will generate its full controls,
      but they remain hidden until Edit Structure is clicked.
    */

    #ctrStructureBuilder {

      margin: 0 !important;

      border: 0 !important;
      border-top: 0 !important;

      background: #ffffff !important;

    }


    /* =====================================================
       CONNECTION BAR

       ctr-editor.js automatically creates its own bar.
       Keep it compact and visually part of editor tools.
    ===================================================== */

    #ctrDrawingEditorToolbar {

      margin:
        0
        0
        12px !important;

      border:
        1px solid #cbd4dd !important;

      background:
        #ffffff !important;

    }


    /* =====================================================
       DRAWING SHEET
    ===================================================== */

    .ctr-sheet-workspace {

      width: 100%;

      overflow: auto;

      border:
        1px solid #c6cfd8;

      background: #dfe4e8;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    }


    #drawingHost {

      min-width: 1280px;

      padding:
        28px
        20px;

    }


    #drawingHost svg {

      display: block;

      margin:
        0
        auto;

      background: #ffffff;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,0.12);

    }


    /* =====================================================
       HIDE BUILDER FROM NORMAL PAGE FLOW

       JavaScript moves it inside our drawer after load.
    ===================================================== */

    body > #ctrStructureBuilder {

      display: none !important;

    }


    @media
    (max-width: 800px) {

      .ctr-drawing-page {

        padding:
          14px
          10px
          25px;

      }


      .ctr-drawing-page-head {

        display: block;

      }


      .ctr-drawing-status {

        margin-top: 12px;

      }


      .ctr-drawing-command-bar {

        align-items: flex-start;
        flex-direction: column;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       WEBSITE PAGE
  ====================================================== -->

  <main class="ctr-drawing-page">


    <!-- PAGE TITLE -->

    <section class="ctr-drawing-page-head">


      <div>

        <div class="ctr-drawing-breadcrumb">

          DIVISIONS & STATIONS
          /
          STATION CTR
          /
          DRAWING

        </div>


        <h1>
          Belkheda Station CTR
        </h1>


        <p class="ctr-drawing-subtitle">

          Engineering CTR Drawing · Sheet 1A

        </p>

      </div>


      <div class="ctr-drawing-status">

        <span class="ctr-drawing-chip">
          BELD
        </span>

        <span class="ctr-drawing-chip">
          SHEET 1A
        </span>

        <span class="ctr-drawing-chip">
          REVISION 0
        </span>

        <span class="ctr-drawing-chip draft">
          DRAFT
        </span>

      </div>


    </section>


    <!-- ===================================================
         COMMAND BAR
    ==================================================== -->

    <section class="ctr-drawing-command-bar">


      <div class="ctr-drawing-command-left">


        <button
          type="button"
          class="ctr-work-btn"
          onclick="history.back()"
        >
          ← Back
        </button>


        <button
          type="button"
          class="ctr-work-btn"
          id="openStructureBuilder"
        >
          Edit Structure
        </button>


        <button
          type="button"
          class="ctr-work-btn"
          id="pageAddConnection"
        >
          + Connection
        </button>


      </div>


      <div class="ctr-drawing-command-right">


        <button
          type="button"
          class="ctr-work-btn"
        >
          Save Draft
        </button>


        <button
          type="button"
          class="ctr-work-btn"
        >
          Preview Complete CTR
        </button>


        <button
          type="button"
          class="ctr-work-btn primary"
        >
          Generate PDF
        </button>


      </div>


    </section>


    <!-- ===================================================
         STRUCTURE DRAWER
    ==================================================== -->

    <section
      id="ctrBuilderDrawer"
    >


      <div class="ctr-builder-drawer-head">


        <div>

          <strong>
            Edit CTR Structure
          </strong>

          <span>
            Rack, Row, Column, Fuse and Location configuration
          </span>

        </div>


        <button
          type="button"
          id="ctrCloseBuilder"
        >
          ×
        </button>


      </div>


      <div id="ctrBuilderMount"></div>


    </section>


    <!-- ===================================================
         SVG SHEET
    ==================================================== -->

    <section class="ctr-sheet-workspace">


      <div id="drawingHost"></div>


    </section>


  </main>


  <!-- =====================================================
       EXISTING WEBSITE / AUTH
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="js/supabase-config.js"></script>

  <script src="js/auth-guard.js"></script>

  <script src="js/role-access.js"></script>

  <!--
    This generates the same Railway header/navigation
    used by the rest of the CTR website.
  -->
  <script src="js/railway-shell.js"></script>


  <!-- =====================================================
       DRAWING ENGINE
  ====================================================== -->

  <script src="js/ctr-drawing-engine.js"></script>

  <script src="js/ctr-sheet-renderer.js"></script>

  <script src="js/ctr-prototype-data.js"></script>

  <script src="js/ctr-editor.js"></script>

  <script src="js/ctr-builder.js"></script>


  <!-- =====================================================
       CLEAN WORKSPACE CONTROLLER
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      const drawer =
        document.getElementById(
          "ctrBuilderDrawer"
        );


      const mount =
        document.getElementById(
          "ctrBuilderMount"
        );


      const openButton =
        document.getElementById(
          "openStructureBuilder"
        );


      const closeButton =
        document.getElementById(
          "ctrCloseBuilder"
        );


      const connectionButton =
        document.getElementById(
          "pageAddConnection"
        );


      /* ===============================================
         MOVE GENERATED BUILDER INTO DRAWER
      =============================================== */

      function mountBuilder() {

        const builder =
          document.getElementById(
            "ctrStructureBuilder"
          );


        if (
          !builder ||
          !mount
        ) {

          return false;

        }


        if (
          builder.parentNode !==
          mount
        ) {

          mount.appendChild(
            builder
          );

        }


        builder.style.display =
          "block";


        return true;

      }


      /*
        ctr-builder.js initializes after DOM load.
        Check until builder exists.
      */

      let attempts =
        0;


      const timer =
        window.setInterval(
          function () {

            attempts +=
              1;


            if (
              mountBuilder() ||
              attempts >
              30
            ) {

              window.clearInterval(
                timer
              );

            }

          },
          100
        );


      /* ===============================================
         OPEN BUILDER
      =============================================== */

      openButton
        ?.addEventListener(
          "click",
          function () {

            mountBuilder();


            drawer.classList.add(
              "open"
            );


            openButton.textContent =
              "Structure Open";

          }
        );


      /* ===============================================
         CLOSE BUILDER
      =============================================== */

      closeButton
        ?.addEventListener(
          "click",
          function () {

            drawer.classList.remove(
              "open"
            );


            openButton.textContent =
              "Edit Structure";

          }
        );


      /* ===============================================
         CONNECTION
      =============================================== */

      connectionButton
        ?.addEventListener(
          "click",
          function () {

            if (
              window.CTR_EDITOR &&
              typeof window.CTR_EDITOR
                .startConnect ===
              "function"
            ) {

              window.CTR_EDITOR
                .startConnect();

            }

          }
        );


    })();

  </script>


</body>

</html>
