<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Set CTR Password</title>

  <link rel="stylesheet" href="css/ctr.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .password-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .password-box {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      border: 1px solid #d9e2ec;
      border-radius: 10px;

      padding: 30px;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.06);
    }

    .password-box h1 {
      margin-top: 0;

      color: #0c2d53;

      font-size: 24px;
    }

    .password-box p {
      color: #66788a;

      font-size: 13px;

      line-height: 1.6;

      margin-bottom: 25px;
    }

    .password-field {
      margin-bottom: 16px;
    }

    .password-field label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;
      font-weight: bold;

      color: #17395d;
    }

    .password-field input {
      width: 100%;

      box-sizing: border-box;

      padding: 11px;

      border: 1px solid #cbd5e1;
      border-radius: 6px;

      font-size: 14px;
    }

    .password-button {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 6px;

      background: #0c2d53;

      color: #ffffff;

      font-size: 14px;

      cursor: pointer;
    }

    .password-button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    #passwordMessage {
      min-height: 20px;

      margin-bottom: 10px;

      font-size: 12px;
    }

  </style>

</head>


<body>


<div class="password-page">

  <div class="password-box">

    <h1>
      Set Your Password
    </h1>

    <p id="inviteStatus">
      Checking your invitation...
    </p>


    <form id="passwordForm">

      <div class="password-field">

        <label for="newPassword">
          New Password
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password"
          required
        >

      </div>


      <div class="password-field">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter password again"
          autocomplete="new-password"
          required
        >

      </div>


      <div id="passwordMessage"></div>


      <button
        type="submit"
        id="passwordButton"
        class="password-button"
      >
        Set Password
      </button>

    </form>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase-config.js"></script>

<script src="js/set-password.js"></script>


</body>

</html>
